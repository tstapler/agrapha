[package]
name = "agrapha-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "agrapha_native"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21"
libc = "0.2"

# PipeWire audio capture (Linux system audio) — 0.9.x required for PipeWire 1.x headers
pipewire = "0.9"
libspa = "0.9"

# X11 global hotkey (works on X11 and XWayland Wayland sessions)
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }

# Wayland global shortcut portal (GNOME 46+ / KDE Plasma 6)
zbus = { version = "4", features = ["blocking"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
