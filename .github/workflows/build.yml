name: Build and Test

on:
  push:
    branches: [main]
    tags-ignore: ['**']   # release.yml handles tag pushes
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/agrapha-native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/agrapha-native/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Whisper JNI strategy: the whisper-jni Maven artifact (v1.6.1) bundles a
      # CPU-only dylib; CoreML acceleration requires building from source.
      # Spike ADR-004: once whisper-jni 1.7.1 is verified to include a macOS arm64
      # CoreML dylib, this step can be removed and libs.versions.toml updated to 1.7.1.
      - name: Cache WhisperCoreML build
        uses: actions/cache@v4
        with:
          path: native/WhisperCoreML/build
          key: ${{ runner.os }}-whisper-jni-${{ hashFiles('native/WhisperCoreML/Makefile', 'gradle/libs.versions.toml') }}

      - name: Build WhisperCoreML dylib
        run: |
          brew install cmake
          cd native/WhisperCoreML
          make

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            native/FluidDiarizationBridge/.build
          key: ${{ runner.os }}-spm-${{ hashFiles('native/FluidDiarizationBridge/Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build FluidAudio bridge
        run: ./gradlew :composeApp:buildFluidDiarizationBridge -PfluidAudioEnabled=true --no-daemon

      - name: Run desktop tests
        run: ./gradlew :composeApp:desktopTest --no-daemon

      - name: Build DMG (verification only)
        run: ./gradlew :composeApp:packageReleaseDmg --no-daemon

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/agrapha-native/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('native/agrapha-native/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install PipeWire and X11 dev headers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libpipewire-0.3-dev \
            libspa-0.2-dev \
            libx11-dev \
            libx11-xcb-dev \
            xvfb \
            ydotool

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run desktop tests (includes Rust build via buildAgraphaNative)
        run: xvfb-run ./gradlew :composeApp:desktopTest --no-daemon

  build-linux-cuda:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Compiles the CUDA .so and bundles it into app resources.
    # No GPU is required — the CUDA toolkit is enough to compile; the resulting
    # binary is verified loadable on a machine with NVIDIA drivers at runtime.

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install CUDA toolkit
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            cmake \
            cuda-toolkit-12-6

      - name: Add nvcc to PATH
        run: echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"

      - name: Cache whisper-jni CUDA build
        uses: actions/cache@v4
        with:
          path: native/WhisperCUDA/build
          key: ${{ runner.os }}-whisper-cuda-${{ hashFiles('native/WhisperCUDA/Makefile', 'gradle/libs.versions.toml') }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-cuda-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-cuda-

      - name: Build WhisperCUDA .so and bundle into resources
        run: ./gradlew :composeApp:buildWhisperCuda -PcudaEnabled=true --no-daemon

      - name: Verify .so was produced
        run: |
          ls -lh composeApp/src/desktopMain/resources/libwhisperjni-cuda.so
          file composeApp/src/desktopMain/resources/libwhisperjni-cuda.so
